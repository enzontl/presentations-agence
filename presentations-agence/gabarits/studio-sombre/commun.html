<!-- Éléments communs à insérer une seule fois dans deck.html : sprite SVG en début de body, scripts en fin de body. Les données des graphiques sont des exemples. -->

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
// ---------- Graphiques à partir des données ----------
const PRIX=[["Marge distributeur",1.20,1],["Marge Kōri",.60],["Café vert + torréfaction",.58],["Canette alu",.27],["Logistique",.22],["TVA 5,5 %",.17],["Infusion 48 h",.16]];
(document.getElementById('bars')||{}).innerHTML=PRIX.map(([k,v,hl],i)=>{const y=30+i*74,w=v/1.2*700;
  return `<text x="300" y="${y+30}" text-anchor="end" style="${hl?'fill:#efe9df;font-weight:700':''}">${k}</text>
  <rect x="320" y="${y+6}" width="${w}" height="34" fill="${hl?'var(--hl)':'#6f685f'}"><title>${k} : ${v.toFixed(2).replace('.',',')} €</title></rect>
  <text x="${330+w}" y="${y+31}" style="fill:${hl?'#efe9df':'#c9c2b6'};font-weight:${hl?700:400}">${v.toFixed(2).replace('.',',')}</text>`}).join('');
const FREQ=[[2021,248,312],[2022,301,305],[2023,338,298],[2024,361,295],[2025,412,286]];
const yv=v=>540-v/400*427;
(document.getElementById('cols')||{}).innerHTML=FREQ.map(([a,e],i)=>{const x=150+i*185,last=i===4;
  return `<rect x="${x}" y="${yv(e)}" width="110" height="${540-yv(e)}" fill="${last?'var(--hl)':'#6f685f'}"><title>${a} : ${e} 000 entrées</title></rect>
  <text x="${x+55}" y="${yv(e)-16}" text-anchor="middle" style="fill:${last?'#efe9df':'#c9c2b6'};font-weight:${last?700:400}">${e} k</text>
  <text x="${x+55}" y="578" text-anchor="middle" style="fill:#948d82;font-size:20px">${a}</text>`}).join('')
 +`<polyline fill="none" stroke="#c9c2b6" stroke-width="3" stroke-dasharray="8 8" points="${FREQ.map(([a,e,p],i)=>`${205+i*185},${yv(p)}`).join(' ')}"/>`
 +FREQ.map(([a,e,p],i)=>`<circle cx="${205+i*185}" cy="${yv(p)}" r="7" fill="#c9c2b6"><title>${a} : ${p} 000 prêts</title></circle>`).join('')
 +`<text x="${205+4*185+20}" y="${yv(286)+52}" style="fill:#c9c2b6;font-size:20px" text-anchor="end">prêts</text>`;

// ---------- Studio 3D ----------
const PRINT=location.search.includes('print=1');
const lin=hex=>new THREE.Color(hex).convertSRGBToLinear();
let sd=12345; const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

function envMap(r){
  const pm=new THREE.PMREMGenerator(r), st=new THREE.Scene();
  st.add(new THREE.Mesh(new THREE.BoxGeometry(40,40,40),new THREE.MeshBasicMaterial({color:0x050404,side:THREE.BackSide})));
  const panel=(w,h,col,p)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));m.position.set(...p);m.lookAt(0,0,0);st.add(m);};
  panel(14,14,new THREE.Color(2.3,2.1,1.85),[2,12,3]);
  panel(10,12,new THREE.Color(.5,.47,.44),[-13,2,6]);
  panel(14,1.6,new THREE.Color(1.2,1.5,2.1),[8,3,-12]);
  return pm.fromScene(st,.04).texture;
}
function renderer(canvas,w,h){
  const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
  r.setPixelRatio(PRINT?1.5:Math.min(devicePixelRatio,2)); r.setSize(w,h,false);
  r.outputEncoding=THREE.sRGBEncoding; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
  return r;
}
function contactShadow(w,d,round){
  const px=128,c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.translate(256,256);
  [[.9375,.5,1.3],[.25,.65,1.06],[.046875,.9,1.005]].forEach(([u,a,k])=>{ctx.filter=`blur(${u*px*.5}px)`;ctx.fillStyle=`rgba(0,0,0,${a})`;
    if(round){ctx.beginPath();ctx.ellipse(0,0,w*px*k/2,d*px*k/2,0,0,Math.PI*2);ctx.fill();} else ctx.fillRect(-w*px*k/2,-d*px*k/2,w*px*k,d*px*k);});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1}));
  m.rotation.x=-Math.PI/2; return m;
}
function studio(canvas,camPos,camTgt,o={}){
  const r=renderer(canvas,1920,1080), scene=new THREE.Scene();
  scene.environment=envMap(r);
  const cam=new THREE.PerspectiveCamera(26,1920/1080,.1,100); cam.position.set(...camPos); cam.lookAt(...camTgt);
  const F=-1.1,BX=3.3,R=5,L=18,A=Math.PI*R/2;
  const sw=new THREE.PlaneGeometry(60,40,1,200),pa=sw.attributes.position;
  for(let i=0;i<pa.count;i++){const s=pa.getY(i)+20;let y,z;
    if(s<L){z=12-s;y=F;} else if(s<L+A){const a=(s-L)/R;z=12-L-R*Math.sin(a);y=F+R*(1-Math.cos(a));} else {z=12-L-R;y=F+R+s-L-A;}
    pa.setXYZ(i,pa.getX(i)+BX,y,z);}
  sw.computeVertexNormals();
  scene.add(new THREE.Mesh(sw,new THREE.MeshStandardMaterial({color:lin(0x163a78),roughness:1,metalness:0,envMapIntensity:.04})));
  const key=new THREE.SpotLight(0xffe6c4,o.key||5.5,45,.46,1,1.5); key.position.set(BX+1.2,11,3); key.target.position.set(BX,F,-1);
  const wall=new THREE.SpotLight(0xffdcb4,1.6,50,.5,1,1); wall.position.set(BX-.5,7,6); wall.target.position.set(BX,1.2,-11);
  scene.add(key,key.target,wall,wall.target,new THREE.HemisphereLight(0xfff2e2,0x080504,.08));
  // halo chaud dans l'air
  const hc=document.createElement('canvas');hc.width=hc.height=256;const hx=hc.getContext('2d');const g=hx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,214,170,.20)');g.addColorStop(1,'rgba(255,214,170,0)');hx.fillStyle=g;hx.fillRect(0,0,256,256);
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(8,14),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(hc),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false}));
  halo.position.set(BX,4.5,-1.5); scene.add(halo);
  // poussière
  const n=240,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const a=rnd()*6.28,rr=Math.sqrt(-2*Math.log(rnd()+1e-6))*.9;
    pos[i*3]=BX+Math.cos(a)*rr;pos[i*3+1]=F+rnd()*8;pos[i*3+2]=-1+Math.sin(a)*rr;}
  const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(dg,new THREE.PointsMaterial({color:0xffd9b0,size:.04,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false})));
  return {r,scene,cam,F,BX};
}

// ---------- Objets ----------
function canTexture(){
  const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');
  return {c,x};
}
function makeCan(){
  // profil : 4 points de fond, 20 points de flanc, 6 points de col et couvercle
  const pts=[[0,.04],[.36,0],[.47,.03],[.55,.13]];
  for(let i=0;i<20;i++)pts.push([.55,.16+i*(2.0-.16)/19]);
  pts.push([.54,2.1],[.49,2.26],[.45,2.33],[.455,2.37],[.43,2.39],[0,2.36]);
  const N=pts.length, v0=3/(N-1), v1=23/(N-1);
  const {c,x}=canTexture(),H=1024,W=2048;
  x.fillStyle='#b9bcc0';x.fillRect(0,0,W,H);                                 // alu nu
  const top=H*(1-v1), bot=H*(1-v0);
  x.fillStyle='#141414';x.fillRect(0,top,W,bot-top);                         // encre noire
  x.fillStyle='#E8774F';x.fillRect(0,top+(bot-top)*.70,W,(bot-top)*.07);     // bande terracotta
  x.fillStyle='#efe9df';x.textBaseline='middle';
  x.font='820 260px Archivo';x.fillText('KŌRI',140,top+(bot-top)*.38);
  x.font='600 64px Archivo';x.fillText('COLD BREW · 25 CL',150,top+(bot-top)*.58);
  x.font='500 40px Archivo';x.fillStyle='#9CC9DB';x.fillText('INFUSÉ 48 H À LYON',150,top+(bot-top)*.86);
  x.font='820 260px Archivo';x.fillStyle='#efe9df';x.fillText('KŌRI',1160,top+(bot-top)*.38);
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
  const geo=new THREE.LatheGeometry(pts.map(([a,b])=>new THREE.Vector2(a,b)),96);
  const mat=new THREE.MeshPhysicalMaterial({map:tex,metalness:.55,roughness:.32,clearcoat:.6,clearcoatRoughness:.25,envMapIntensity:1.1});
  const m=new THREE.Mesh(geo,mat); const g=new THREE.Group(); g.add(m); return g;
}
function rrect(w,d,r){const s=new THREE.Shape();s.moveTo(-w/2+r,-d/2);s.lineTo(w/2-r,-d/2);s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);
  s.lineTo(w/2,d/2-r);s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);s.lineTo(-w/2+r,d/2);s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);s.lineTo(-w/2,-d/2+r);s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);return s;}
const MATS={};
const cloth=hex=>MATS[hex]||(MATS[hex]=new THREE.MeshPhysicalMaterial({color:lin(hex),roughness:.78,metalness:0,clearcoat:.08,envMapIntensity:.8}));
function makeBook(w,d,h,col){
  const g=new THREE.Group(),t=.07;
  const board=new THREE.ExtrudeGeometry(rrect(w-.08,d-.08,.04),{depth:t-.04,bevelEnabled:true,bevelThickness:.02,bevelSize:.02,bevelSegments:4,curveSegments:6});
  board.rotateX(-Math.PI/2);
  const b1=new THREE.Mesh(board,cloth(col)); b1.position.y=0;
  const b2=new THREE.Mesh(board,cloth(col)); b2.position.y=h-t;
  const pages=new THREE.Mesh(new THREE.BoxGeometry(w-.14,h-2*t+.01,d-.12),new THREE.MeshStandardMaterial({color:lin(0xEDE3CC),roughness:.92}));
  pages.position.set(.03,h/2,0);
  const spine=new THREE.Mesh(new THREE.CylinderGeometry(h/2,h/2,d-.02,24,1,false,Math.PI,Math.PI),cloth(col));
  spine.rotation.x=Math.PI/2; spine.scale.set(.35,1,1); spine.position.set(-w/2+.02,h/2,0);
  const gilt=new THREE.Mesh(new THREE.BoxGeometry(.012,.04,d*.5),new THREE.MeshPhysicalMaterial({color:lin(0xD9B45A),metalness:1,roughness:.3}));
  gilt.position.set(-w/2-.05,h/2,0);
  g.add(b1,b2,pages,spine,gilt); return g;
}
function makeStack(){
  const g=new THREE.Group(); let y=0;
  [[2.9,2.1,.42,0x2E6B4F,.05],[2.6,1.9,.34,0x8E2A23,-.12],[2.75,2.0,.5,0xD9CDB2,.09],[2.3,1.7,.3,0x1F3A5F,-.04]].forEach(([w,d,h,c,ry])=>{
    const b=makeBook(w,d,h,c); b.position.y=y; b.rotation.y=ry; g.add(b); y+=h+.004; });
  return g;
}
function snapshot(makeObj,round){
  const c=document.createElement('canvas'); const r=renderer(c,420,420); r.setPixelRatio(1);
  const s=new THREE.Scene(); s.environment=envMap(r);
  s.add(new THREE.HemisphereLight(0xfff2e2,0x080504,.6)); const k=new THREE.DirectionalLight(0xffe6c4,2.2); k.position.set(2,6,4); s.add(k);
  const o=makeObj(); s.add(o); o.rotation.y=-.5;
  const box=new THREE.Box3().setFromObject(o),ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()).length();
  const cam=new THREE.PerspectiveCamera(30,1,.1,100); cam.position.set(ctr.x,ctr.y+sz*.35,ctr.z+sz*1.7); cam.lookAt(ctr);
  r.render(s,cam); return c.toDataURL('image/png');
}

async function init(){
  await document.fonts.load('820 260px Archivo'); await document.fonts.ready;
  // Objet 1 (exemple : canette). Chaque bloc ne tourne que si son canvas existe.
  if(document.getElementById('sc-can')){const S=studio(document.getElementById('sc-can'),[0,2.3,15.5],[0,.6,0]);
   const can=makeCan(); can.scale.setScalar(1.55); can.position.set(S.BX,S.F,0); can.rotation.y=-1.55; S.scene.add(can);
   const sh=contactShadow(1.15,1.15,true); sh.scale.setScalar(1.55); sh.position.set(S.BX,S.F+.003,0); S.scene.add(sh);
   const tick=t=>{can.rotation.y=-1.55+t*.00009; S.r.render(S.scene,S.cam); if(!PRINT) requestAnimationFrame(tick);};
   tick(0);}
  // Objet 2 (exemple : pile de livres)
  if(document.getElementById('sc-books')){const S=studio(document.getElementById('sc-books'),[0,3.0,14.5],[0,.3,0],{key:6});
   const st=makeStack(); st.scale.setScalar(1.25); st.position.set(S.BX,S.F,0); st.rotation.y=-.5; S.scene.add(st);
   const sh=contactShadow(2.9,2.1,false); sh.scale.setScalar(1.3); sh.rotation.z=.5; sh.position.set(S.BX,S.F+.003,0); S.scene.add(sh);
   const tick=t=>{st.rotation.y=-.5+t*.00009; S.r.render(S.scene,S.cam); if(!PRINT) requestAnimationFrame(tick);};
   tick(0);}
  const canImg=snapshot(makeCan), bookImg=snapshot(makeStack);
  document.querySelectorAll('img[data-obj=can]').forEach(i=>i.src=canImg);
  document.querySelectorAll('img[data-obj=book]').forEach(i=>i.src=bookImg);
  document.body.dataset.ready='1';
}
init();
</script>
