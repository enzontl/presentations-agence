<!-- Monde persistant : le canvas en début de body, les scripts en fin de body. Adapter les bâtiments héros (fonction hero, zones dégagées) au lieu du sujet ; chaque slide porte sa pose dans data-pose. -->
<canvas id="monde" width="1920" height="1080"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
// Monde persistant « Heure bleue » : une ville au crépuscule, deux bâtiments héros (l'épicerie, la bibliothèque)
// qui se construisent (build 0 à 5) et s'allument. Chaque slide porte sa pose dans data-pose.
// Rendu statique (rendu.py, PDF) : une image fixe par slide, en fond. Export (deck-live) : canvas animé, caméra qui vole.
(function(){
  const W=1920,H=1080, canvas=document.getElementById('monde');
  const r=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
  r.setPixelRatio(1); r.setSize(W,H,false);
  r.outputEncoding=THREE.sRGBEncoding; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.15;
  const lin=h=>new THREE.Color(h).convertSRGBToLinear();
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(38,W/H,.5,900);
  let sd=7; const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

  // ciel : dégradé peint sur une sphère, recalculé selon le crépuscule
  const skyC=document.createElement('canvas'); skyC.width=4; skyC.height=256;
  const skyT=new THREE.CanvasTexture(skyC); skyT.encoding=THREE.sRGBEncoding;
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide,fog:false,toneMapped:false})));
  const mix=(a,b,t)=>'#'+[0,2,4].map(i=>Math.round(parseInt(a.substr(i+1,2),16)*(1-t)+parseInt(b.substr(i+1,2),16)*t).toString(16).padStart(2,'0')).join('');
  scene.fog=new THREE.Fog(0x0b1433,90,420);
  function sky(d){const x=skyC.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
    g.addColorStop(0,mix('#1a2a66','#060c24',d)); g.addColorStop(.42,mix('#3d4a8f','#0b1433',d));
    g.addColorStop(.5,mix('#c98a7a','#1c2350',d)); g.addColorStop(.56,mix('#2a2f5c','#0b1020',d)); g.addColorStop(1,'#05081a');
    x.fillStyle=g; x.fillRect(0,0,4,256); skyT.needsUpdate=true; scene.fog.color.set(mix('#2c3470','#0b1433',d));}

  // sol et rues
  const sol=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({color:lin(0x0e1532),roughness:1}));
  sol.rotation.x=-Math.PI/2; scene.add(sol);
  const rue=new THREE.MeshStandardMaterial({color:lin(0x161d3c),roughness:.9});
  for(let k=-6;k<=6;k++){const a=new THREE.Mesh(new THREE.PlaneGeometry(1200,7),rue);a.rotation.x=-Math.PI/2;a.position.set(0,.02,k*40+20);scene.add(a);
    const b=a.clone();b.rotation.z=Math.PI/2;b.position.set(k*40+20,.02,0);scene.add(b);}
  scene.add(new THREE.HemisphereLight(lin(0x8fa8ff),lin(0x0b1020),.55));
  const lune=new THREE.DirectionalLight(lin(0xaebfff),.5); lune.position.set(-60,80,40); scene.add(lune);

  // façades : textures de fenêtres (allumées au hasard), partagées
  function facade(lit,cols,rows,big){const c=document.createElement('canvas');c.width=128;c.height=256;const x=c.getContext('2d');
    x.fillStyle='#000';x.fillRect(0,0,128,256);
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){if(rnd()>lit)continue;const w=128/cols,h=256/rows;
      x.fillStyle=['#ffc46b','#ffb45a','#ffd79a','#f0a868'][Math.floor(rnd()*4)];x.globalAlpha=.55+rnd()*.45;
      x.fillRect(i*w+w*.22,j*h+h*(big?.12:.25),w*.56,h*(big?.76:.5));}
    const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
  const tex=[facade(.35,4,8),facade(.22,5,10),facade(.5,3,6)];
  const mats=tex.map(t=>new THREE.MeshStandardMaterial({color:lin(0x1b2346),roughness:.85,emissive:lin(0xffffff),emissiveMap:t,emissiveIntensity:1}));
  const toit=new THREE.MeshStandardMaterial({color:lin(0x121a38),roughness:1});
  const zones=[[0,0,24],[70,-40,34]];
  // couloir dégagé entre chaque caméra et ce qu'elle regarde : la ville ne bouche jamais la vue
  document.querySelectorAll('section.slide[data-pose]').forEach(s=>{const p=JSON.parse(s.dataset.pose);
    for(let k=0;k<=8;k++){const t=k/8;zones.push([p.pos[0]+(p.look[0]-p.pos[0])*t,p.pos[2]+(p.look[2]-p.pos[2])*t,14]);}});
  for(let gx=-8;gx<=8;gx++)for(let gz=-8;gz<=8;gz++){
    for(let s=0;s<2;s++){const x=gx*40+(s?-6:8)+rnd()*6,z=gz*40+(rnd()*10-5);
      if(zones.some(([zx,zz,rr])=>Math.hypot(x-zx,z-zz)<rr))continue;
      const w=8+rnd()*8,d=8+rnd()*8,h=5+Math.pow(rnd(),2)*42;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mats[s%3],mats[(s+1)%3],toit,toit,mats[(gx+gz+8)%3],mats[s%3]]);
      m.position.set(x,h/2,z);scene.add(m);}}
  // lampadaires : halos additifs
  const halo=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,205,140,1)');g.addColorStop(.25,'rgba(255,170,90,.45)');g.addColorStop(1,'rgba(255,170,90,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
    return new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});})();
  for(let k=-6;k<=6;k++)for(let q=-6;q<=6;q+=1){const sp=new THREE.Sprite(halo);sp.scale.set(5,5,1);sp.position.set(q*40+24.5,4.6,k*40+16);scene.add(sp);}

  // bâtiments héros : un fil de fer bleu (le plan), un volume qui monte (build 1 à 3), des vitres qui s'allument (build 5)
  const heros=[];
  function hero(x,z,w,h,d,etages,enseigne){
    const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
    const plan=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),new THREE.LineBasicMaterial({color:lin(0x9dbcff),transparent:true}));
    plan.position.y=h/2;g.add(plan);
    const vt=facade(1,enseigne?4:6,etages,true);
    const vit=new THREE.MeshStandardMaterial({color:lin(0x232c55),roughness:.6,emissive:lin(0xffffff),emissiveMap:vt,emissiveIntensity:0});
    const corps=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[vit,vit,toit,toit,vit,vit]);g.add(corps);
    let sign=null;
    if(enseigne){const c=document.createElement('canvas');c.width=512;c.height=128;sign={c,mat:new THREE.MeshBasicMaterial({transparent:true,toneMapped:false})};
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w*.7,w*.7/4),sign.mat);m.position.set(0,4.4,d/2+.05);g.add(m);sign.mesh=m;}
    heros.push({g,plan,corps,vit,h,sign,enseigne});}
  hero(0,0,16,16,12,5,'KŌRI');
  hero(70,-40,34,13,16,3,null);
  function drawSign(o){if(!o.sign)return;const x=o.sign.c.getContext('2d');x.clearRect(0,0,512,128);
    x.fillStyle='rgba(6,10,28,.9)';x.fillRect(0,0,512,128);x.font='600 84px "Archivo Narrow"';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle='#ffc46b';x.shadowColor='#ffb45a';x.shadowBlur=24;x.fillText(o.enseigne,256,70);
    o.sign.mat.map=new THREE.CanvasTexture(o.sign.c);o.sign.mat.map.encoding=THREE.sRGBEncoding;o.sign.mat.needsUpdate=true;}
  function setBuild(b){heros.forEach(o=>{
    const up=Math.min(1,Math.max(0,(b-1)/2));
    o.corps.scale.y=Math.max(.001,up);o.corps.position.y=o.h*up/2;o.corps.visible=up>0.001;
    o.plan.material.opacity=Math.max(0,1-up*1.2);o.plan.visible=o.plan.material.opacity>0.01;
    o.vit.emissiveIntensity=Math.min(1.6,Math.max(0,(b-3.6)/1.4)*1.6);
    if(o.sign){o.sign.mesh.visible=b>=4;o.sign.mat.opacity=Math.min(1,Math.max(0,b-4));}});}

  // pose : position, cible, champ, décalage de l'image (shift) pour libérer la colonne de texte
  function applyPose(p){cam.fov=p.fov||38;cam.position.set(...p.pos);cam.lookAt(...p.look);
    cam.setViewOffset(W,H,-(p.shift||0)*W,0,W,H);cam.updateProjectionMatrix();setBuild(p.build??5);sky(p.dusk??.5);}
  function pins(sec){sec.querySelectorAll('.epingle[data-point]').forEach(e=>{const v=new THREE.Vector3(...e.dataset.point.split(',').map(Number)).project(cam);
    e.style.left=((v.x+1)/2*W)+'px';e.style.top=((1-v.y)/2*H)+'px';e.style.visibility=v.z<1?'visible':'hidden';});}
  const secs=[...document.querySelectorAll('section.slide')], poses=secs.map(s=>JSON.parse(s.dataset.pose||'{}'));

  (document.fonts?document.fonts.load('600 84px "Archivo Narrow"'):Promise.resolve()).then(()=>{
    heros.forEach(drawSign);
    // une image fixe par slide (rendu statique, PDF, et fond de secours)
    secs.forEach((s,i)=>{applyPose(poses[i]);r.render(scene,cam);
      const im=new Image();im.className='bg monde-still';im.alt='';im.src=canvas.toDataURL('image/jpeg',.9);s.insertBefore(im,s.firstChild);pins(s);});
    document.body.dataset.monde='pret';
    // mode présentation : la caméra vole d'une pose à l'autre
    let cur=null,from=null,t0=0,dur=1.6,anim=false;
    const lerp=(a,b,t)=>a+(b-a)*t, ease=k=>1-Math.pow(1-k,3);
    function frame(now){const k=Math.min(1,(now-t0)/(dur*1000)),e=ease(k);
      const p={pos:cur.pos.map((v,j)=>lerp(from.pos[j],v,e)),look:cur.look.map((v,j)=>lerp(from.look[j],v,e)),fov:lerp(from.fov||38,cur.fov||38,e),
        shift:lerp(from.shift||0,cur.shift||0,e),build:lerp(from.build??5,cur.build??5,e),dusk:lerp(from.dusk??.5,cur.dusk??.5,e)};
      applyPose(p);r.render(scene,cam);const s=secs.find(x=>x.classList.contains('is-active'));if(s)pins(s);
      if(k<1)requestAnimationFrame(frame);else anim=false;}
    document.addEventListener('deck:slide',ev=>{const p=poses[ev.detail.i];if(!p)return;
      from=cur?JSON.parse(JSON.stringify(cur)):p;cur=p;dur=(from.build??5)!==(p.build??5)?2.4:1.6;t0=performance.now();
      if(!anim){anim=true;requestAnimationFrame(frame);}});
    if(document.body.classList.contains('deck-live')){const i=secs.findIndex(x=>x.classList.contains('is-active'));if(i>=0){cur=poses[i];applyPose(cur);r.render(scene,cam);}}
  });
})();
</script>
